<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cat</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <main class="comic">

        <div class="scene" id="scene">

            <!-- Background -->
            <img class="sky" src="images/sky.png" alt="sky">
            <img class="clouds" src="images/clouds.png" alt="cloud">
            <img class="ground" src="images/ground.png" alt="ground">
            <img class="wall" src="images/wall2.png" alt="wall">
         
            <!-- Person -->
            <img id ="person" class="person" src="images/Amelia_run_left_1.png" alt="Person">
            
            <!-- Cat -->
	    <img id="cat" class="cat"     src="images/cat_appear_1.png"     alt="Cat">
	    <!-- Cat 1 arm -->
	    <img id="cat-1-arm" class="cat"     src="images/cat_1_arm.png"     alt="Cat">
	    <!-- Cat 2 arm-->
	    <img id="cat-2-arm" class="cat"     src="images/cat_2_arm.png"     alt="Cat">

 	    <!-- speech bubble right -->
	    <img id="speech-bubble-right" src="images/speech_bubble_right.png" alt="Go away">
	    
 	    <!-- speech bubble left -->
	    <img id="speech-bubble-left" src="images/speech_bubble_left.png" alt="Go away">
        </div>
	
    </main>
	<script src="script.js"></script>
</body>
</html>
